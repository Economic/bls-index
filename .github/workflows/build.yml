# Manual BLS catalog build on a clean runner. Nothing is published; the artifact holds
# only the run report and resource usage, never source files or Parquet.
name: build

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Initial-scope programs, or 'initial' for all 33"
        default: "initial"
        required: true

permissions:
  contents: read

concurrency:
  group: bls-index-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Stored as a repository secret. It must not contain "github": BLS returns 403.
      BLS_INDEX_USER_AGENT: ${{ secrets.BLS_INDEX_USER_AGENT }}
      ARTIFACT_DIR: ${{ github.workspace }}/build-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.3"
      - name: Install locked toolchain
        run: uv sync --frozen
      - name: Build the catalog
        env:
          PROGRAMS: ${{ inputs.programs }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          set +e
          /usr/bin/time -v -o "$ARTIFACT_DIR/resources.txt" \
            uv run --frozen bls-index build --programs "$PROGRAMS" --workdir "$RUNNER_TEMP/work"
          status=$?
          set -e
          for report in "$RUNNER_TEMP"/work/build-*/report.json; do
            [ -f "$report" ] && cp "$report" "$ARTIFACT_DIR/report.json"
          done
          exit "$status"
      # GitHub masks secrets in logs but not artifacts. Scan every staged file before upload.
      - name: Check artifacts for the User-Agent
        id: user-agent-check
        if: always()
        run: |
          [ -n "$BLS_INDEX_USER_AGENT" ] || exit 0
          if [ -d "$ARTIFACT_DIR" ] && grep -rqF -- "$BLS_INDEX_USER_AGENT" "$ARTIFACT_DIR"; then
            echo "::error::An artifact contains the User-Agent; not uploading artifacts"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.user-agent-check.outcome == 'success'
        with:
          name: build-${{ github.run_id }}
          path: build-artifacts/
          if-no-files-found: warn
          retention-days: 7
