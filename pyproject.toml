[project]
name = "bls-index"
version = "0.0.0"
description = "Build and publish a downloadable catalog of BLS time-series IDs and titles."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "boto3==1.43.108",
    "httpx==0.28.1",
    "polars==2.0.0",
]

[project.scripts]
bls-index = "bls_index.cli:main"

[dependency-groups]
dev = [
    "data-dict-yaml==0.0.3",
    "moto[server]==5.2.3",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bls_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: touches real BLS servers; never runs in default CI",
]

[tool.uv]
required-version = ">=0.10"
