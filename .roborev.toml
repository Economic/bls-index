# .roborev.toml
#
# Naming convention: names ending in _reviewer or _panel are labels chosen for this
# repo. roborev attaches no meaning to them; they only connect the sections below.
# Everything else (section names, keys, and values such as review_type = "design")
# is roborev's own vocabulary.

# ---- Default agent (used by manual `roborev review` without --panel) ----
agent = "codex"
model = "gpt-6-sol"
review_reasoning = "high"

# ---- Which agent runs `--type design` reviews, including automatic ones ----
design_agent = "codex"
design_model = "gpt-6-sol"

# ---- Review behavior ----
review_min_severity = "medium"
auto_close_passing_reviews = true

# Review each commit in a temporary daemon-owned checkout of that commit, so
# reviewers never see uncommitted edits, untracked files, or later work.
# (`roborev review --dirty` still uses the live working tree.)
isolate_reviews = true

# Files left out of review diffs (added to roborev's built-in exclusions).
# Reviewers can still open them in the review checkout. Security reviews ignore
# this list by design. Evidence data stays in diffs so claims can be checked.
exclude_patterns = [
  "uv.lock",
]

review_guidelines = """
Project context: this repository builds a low-stakes public catalog of BLS series IDs
and titles. Once a day it rebuilds everything from fresh BLS files and publishes one
Parquet file plus latest.json. If a run fails, yesterday's catalog keeps being served
and the maintainer is alerted; the next run starts from scratch. Weigh every finding
against those stakes.

Project artifacts:
- design.md is the source of truth. Its "Decisions", "Non-goals" and "Accepted risks"
  sections are settled. Challenge them only with a genuinely new argument, and do not
  report an accepted risk as a defect.
- The current implementation plan is in plans/ (newest dated file). docs/archive/
  holds historical records.
- src/ and tests/ are implementation code.

What to flag:
- Correctness bugs, including wrong rows, wrong titles, lost rows, or a manifest that
  points at an object that was not uploaded and verified.
- Complexity the stakes do not justify: speculative features, defensive checks of
  internal invariants, duplicated validation, instrumentation nobody reads, and tests
  that pin incidental details such as exact error text. Recommending that a
  requirement, check, or test be deleted is a valid finding.
- Deviations from design.md, and changes that add requirements design.md does not ask for.

What not to flag:
- Failure modes that the daily full rebuild already repairs, unless they can publish
  wrong data.
- Missing handling for cases listed under "Accepted risks" or "Non-goals".
- Wording and formatting, unless meaning changes.

The one storage rule that is high severity: never write latest.json before the catalog
object it references has been uploaded and verified by read-back.

Default tests must run offline, without BLS access or credentials.

uv.lock is excluded from diffs. When a change touches dependencies, check the
pins in pyproject.toml and open uv.lock in the checkout if resolved versions
matter.
"""

# ---- Reviewers (subagents) ----
[review.subagents.codex_code_reviewer]
review_type = "default"   # roborev's standard correctness review
agent = "codex"
model = "gpt-6-sol"
reasoning = "high"

[review.subagents.claude_code_reviewer]
review_type = "default"
agent = "claude-code"
model = "opus"
reasoning = "high"

[review.subagents.codex_design_reviewer]
review_type = "design"    # roborev's design-focused review
agent = "codex"
model = "gpt-6-sol"
reasoning = "high"

[review.subagents.claude_design_reviewer]
review_type = "design"
agent = "claude-code"
model = "opus"
reasoning = "high"

[review.subagents.codex_security_reviewer]
review_type = "security"  # roborev's security-focused review
agent = "codex"
model = "gpt-6-sol"
reasoning = "high"

# ---- Panels (groups of reviewers) ----
# Runs on every commit (see hook_review_panel below).
# Once publication code lands (R2 credentials, workflow secrets), add "codex_security_reviewer".
[review.panels.every_commit_panel]
members = ["codex_code_reviewer"]

# Manual, at the plan's milestones: roborev review --branch --panel checkpoint_panel
[review.panels.checkpoint_panel]
members = ["codex_code_reviewer", "claude_code_reviewer", "codex_design_reviewer"]
synthesis_agent = "codex"
synthesis_model = "gpt-6-sol"

# Manual design reviews (formerly the "design" and "design_both" panels).
[review.panels.design_only_panel]
members = ["codex_design_reviewer"]

[review.panels.design_pair_panel]
members = ["codex_design_reviewer", "claude_design_reviewer"]
synthesis_agent = "codex"
synthesis_model = "gpt-6-sol"

# Manual security review: roborev review --branch --panel security_panel
[review.panels.security_panel]
members = ["codex_security_reviewer"]

[review]
hook_review_panel = "every_commit_panel"

# ---- Automatic extra design review on post-commit hooks ----
# roborev adds a `--type design` review (run by design_agent/design_model above)
# on top of the every-commit review when a commit matches. Rules are checked in
# order and the first match wins: trigger_paths, large diff, large file count,
# trigger message patterns, then skip rules; unclear commits go to a classifier.
# Lists replace roborev's defaults.
[auto_design_review]
# Disabled 2026-10-13: run design reviews by hand at milestones instead
# (roborev review --branch --panel design_only_panel).
hook_enabled = false
trigger_paths = [
  "design.md",
  "plans/**",
  "src/bls_index/scope.py",  # fixed published scope
]
skip_paths = [               # skip only if every changed file matches
  "**/*.md",
  "docs/archive/**",
  "tests/fixtures/**",
]
