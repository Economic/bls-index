# Gate 0: fetch real BLS inputs on a clean GitHub-hosted runner and record the runner's
# resources. Read-only against BLS; no object-store credentials are available here.
name: source-probe

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Comma-separated initial-scope programs, or 'initial' for all 33"
        default: "oe,ap,pr"
        required: true
      parse_check:
        description: "Measure polars parse time and peak RSS per .series"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bls-index-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BLS_INDEX_USER_AGENT: ${{ vars.BLS_INDEX_USER_AGENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.3"
      - name: Install locked toolchain
        run: uv sync --frozen
      - name: Record runner resources
        run: uv run --frozen bls-index runner-info --workdir "$RUNNER_TEMP" | tee runner-info.json
      - name: Probe BLS sources
        env:
          PROGRAMS: ${{ inputs.programs }}
          PARSE_CHECK: ${{ inputs.parse_check }}
        run: |
          args=(--programs "$PROGRAMS" --workdir "$RUNNER_TEMP/probe"
                --out probe-report.json --events probe-events.jsonl)
          if [ "$PARSE_CHECK" = "true" ]; then args+=(--parse-check); fi
          uv run --frozen bls-index probe "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-probe-${{ github.run_id }}
          path: |
            runner-info.json
            probe-report.json
            probe-events.jsonl
          if-no-files-found: warn
